<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NORQUE STUDIOS™</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages (single-page-apps-for-github-pages)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoCheck = l.pathname.split('/')[1];
      if (!repoCheck || repoCheck.toLowerCase() !== 'norquestudios') {
        pathSegmentsToKeep = 0;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
