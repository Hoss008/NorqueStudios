<!doctype html>
<html lang="en" class="bg-black text-white antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/compact-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NORQUE STUDIOS™ — Branding, Web Design &amp; Development</title>
    <!-- Preconnect for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      // Single Page App redirect decoder for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.search.slice(1, 4) === 'p=/') {
          var path = l.search.slice(4).split('&')[0].replace(/~and~/g, '&');
          var q = l.search.includes('&q=') ? '?' + l.search.split('&q=')[1].replace(/~and~/g, '&') : '';
          window.history.replaceState(null, null,
              l.pathname.replace(/\/$/, '') + path + q + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-black text-white selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
